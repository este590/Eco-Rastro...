
name: ECO-RASTRO - Generar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto
        run: |
          if [ -f "Eco-Rastro-GitHub-Android.zip" ]; then
            unzip -q "Eco-Rastro-GitHub-Android.zip" -d proyecto
          else
            mkdir -p proyecto
            cp -R . proyecto/
          fi

      - name: Encontrar proyecto
        run: |
          FILE=$(find proyecto -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find proyecto -maxdepth 4 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-RASTRO-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
